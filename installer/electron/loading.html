<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
<title>Apex</title>
<style>
  /* Logo Apex seul, sur fond transparent, affiche avant le chargement de la fenetre principale de l'installateur
     (voir electron/main.cjs, showLoadingLogo). Aucun fond, aucune carte : juste le logo, en blanc translucide. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Totalement opaque (aucun fondu, aucune transparence, aucun halo) : blanc plein, sans contour. */
  svg { width: 320px; height: auto; fill: #fff; opacity: 1; }
</style>
</head>
<body>

</html>
