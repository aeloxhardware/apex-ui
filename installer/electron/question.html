<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Question</title>
<style>
  /* Boite de dialogue volontairement hideuse, facon Windows 95 : premiere chose affichee par l'installateur, avant
     meme le logo (voir electron/main.cjs, showQuestionDialog). Aucun arrondi, aucun degrade, aucune transparence. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #c0c0c0; user-select: none; cursor: default;
               font: 12px/1.3 Tahoma, 'MS Sans Serif', 'Microsoft Sans Serif', Arial, sans-serif; color: #000; }
  .frame { position: absolute; inset: 0; background: #c0c0c0; padding: 3px;
           border: 2px solid; border-color: #dfdfdf #000 #000 #dfdfdf; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080; }
  .title { height: 20px; background: #000080; color: #fff; font-weight: bold; display: flex; align-items: center;
           justify-content: space-between; padding: 0 2px 0 4px; -webkit-app-region: drag; }
  .close { -webkit-app-region: no-drag; width: 16px; height: 14px; background: #c0c0c0; border: 1px solid; font: bold 10px/10px 'Marlett', Arial;
           border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px 0 #808080; display: flex; align-items: center; justify-content: center; color: #000; }
  .close:active { border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px 0 #808080; }
  .body { display: flex; align-items: center; gap: 18px; padding: 22px 22px 8px 20px; }
  .icon { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #0000ff; color: #fff; font: bold 26px/34px 'Times New Roman', serif;
          text-align: center; border: 2px solid #fff; box-shadow: 2px 2px 0 #000; }
  .text { font-size: 12px; }
  .buttons { display: flex; justify-content: center; gap: 10px; padding: 12px 0 10px; }
  button { width: 76px; height: 24px; background: #c0c0c0; font: inherit; color: #000; border: 1px solid;
           border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf; cursor: default; }
  button:active { border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px 0 #808080; padding: 2px 0 0 2px; }
  button:focus { outline: 1px dotted #000; outline-offset: -5px; }
  button.default { border: 2px solid #000; box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #fff; }
</style>
</head>
<body>
  <div class="frame">
    <div class="title"><span>Question</span><div class="close" id="x">x</div></div>
    <div class="body">
      <div class="icon">?</div>
      <div class="text">Voulez-vous installer Apex&nbsp;?</div>
    </div>
    <div class="buttons">
      <button id="yes" class="default" autofocus>Oui</button>
      <button id="no">Non</button>
    </div>
  </div>
  <script>
    const answer = (yes) => window.questionApi.answer(yes);
    document.getElementById('yes').addEventListener('click', () => answer(true));
    document.getElementById('no').addEventListener('click', () => answer(false));
    document.getElementById('x').addEventListener('click', () => answer(false));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') answer(document.activeElement && document.activeElement.id === 'no' ? false : true);
      else if (e.key === 'Escape') answer(false);
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Tab') {
        const other = document.activeElement && document.activeElement.id === 'no' ? 'yes' : 'no';
        document.getElementById(other).focus();
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
