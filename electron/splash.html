<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:; img-src data:" />
<title>Apex</title>
<style>
  /* Écran de démarrage : petite carte aux coins arrondis, sans bordure de fenêtre, affichée avant la
     fenêtre principale et fermée quand le viewport 3D a rendu sa première image. Tout est local et
     inline (aucun réseau) ; les animations tournent dans le processus de cette fenêtre, indépendamment
     du chargement de l'app. Le main écrit la version et l'étape en cours (#version, #status). */
  @font-face {
    font-family: 'Ethnocentric';
    src: url('../dist/fonts/Ethnocentric-Regular.otf'), url('../public/fonts/Ethnocentric-Regular.otf');
  }
  @font-face {
    font-family: 'Orbitron';
    font-weight: 600;
    src: url('../dist/fonts/orbitron-v35-latin-600.woff2'), url('../public/fonts/orbitron-v35-latin-600.woff2');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  .card {
    position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.85);
    /* Même dégradé gris que le voile de changement d'espace. */
    background: radial-gradient(140% 160% at 100% 0%, rgba(150,152,156,0.95), rgba(58,60,66,0.98) 55%, rgba(20,21,24,1) 100%), #141518;
    color: #eafcff; -webkit-app-region: drag;
    animation: appear 0.3s ease-out both;
  }
  .brand {
    position: absolute; left: 34px; top: 34px;
    font-family: 'Ethnocentric', 'Orbitron', sans-serif;
    font-size: 54px; line-height: 1; letter-spacing: 0.05em;
    text-shadow: 0 0 14px rgba(255,255,255,0.55);
  }
  .version {
    position: absolute; left: 36px; top: 104px;
    font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.85);
  }
  .tagline {
    position: absolute; left: 36px; top: 160px; width: 300px;
    font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 9px; line-height: 1.8;
    letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.62);
  }
  .progress { position: absolute; left: 36px; bottom: 30px; display: flex; align-items: center; gap: 14px; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.22); border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }
  #status { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.06em; color: rgba(255,255,255,0.9); }
  /* Motif de couches, rappel des trajectoires d'impression. */
  .layers { position: absolute; right: -40px; bottom: -30px; width: 250px; height: 230px; opacity: 0.35; }
  .layers i {
    position: absolute; left: 0; top: 0; width: 250px; height: 22px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.8); will-change: transform, opacity;
  }
  /* Verre : une fenêtre native (electron/backdrop.cjs) réfracte le bureau sous cette page ; elle devient
     transparente derrière le texte dès que le verre tourne (classe .glass posée par le main). */
  /* Pas tout à fait transparent : un pixel d'alpha nul laisse passer la souris vers les fenêtres de
     derrière (glisser ou cliquer entre les lettres touchait une autre application). Mesuré : 1 % ne suffit pas, 2 % oui ; 3 % pour la marge, invisible. */
  .card.glass { background: rgba(8, 10, 14, 0.14); }
  /* Effet fumé : voiles sombres flous qui dérivent lentement par-dessus le verre. */
  .smoke { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .smoke b {
    position: absolute; width: 340px; height: 260px; border-radius: 50%; filter: blur(46px);
    background: radial-gradient(closest-side, rgba(14,16,22,0.25), rgba(14,16,22,0));
    will-change: transform; animation: drift 18s ease-in-out infinite alternate;
  }
  .smoke b:nth-child(1) { left: -90px; top: -70px; }
  .smoke b:nth-child(2) { right: -110px; top: 40px; animation-duration: 24s; animation-delay: -9s; }
  .smoke b:nth-child(3) { left: 90px; bottom: -120px; animation-duration: 21s; animation-delay: -4s; }
  @keyframes drift { from { transform: translate(-30px, 10px) scale(0.95); } to { transform: translate(40px, -24px) scale(1.12); } }
  /* Fond clair derriere le verre (classe posee par main.cjs) : contenu en sombre. */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div class="card">
    <div class="smoke"><b></b><b></b><b></b></div>
    <div class="brand">APEX</div>
    <div class="version" id="version"></div>
    <div class="tagline">Slicer 5 axes<br />Aelox Hardware</div>
    <div class="layers" id="layers"></div>
    <div class="progress"><div class="spinner"></div><div id="status">Démarrage…</div></div>
  </div>
<script>
  // Sphère de couches animée : les anneaux montent en rétrécissant (profil d'une sphère) et de nouveaux
  // apparaissent en bas en grandissant. Une phase continue fait défiler les 10 anneaux.
  (function () {
    var N = 10, H = 228, SPEED = 0.25; // anneaux ; hauteur de la pile (px) ; tours de la pile par seconde
    var box = document.getElementById('layers'), rings = [];
    for (var i = 0; i < N; i++) { var r = document.createElement('i'); box.appendChild(r); rings.push(r); }
    var t0 = performance.now();
    function frame(now) {
      var phase = ((now - t0) / 1000) * SPEED;
      for (var i = 0; i < N; i++) {
        var u = (((i / N) - phase) % 1 + 1) % 1;      // 0 = bas, 1 = haut
        var y = (1 - u) * (H + 22);                   // le bas de la sphère est en bas
        var k = Math.sqrt(Math.max(0, 1 - Math.pow(2 * u - 1, 2))); // largeur relative de la sphère
        var el = rings[i];
        el.style.transform = 'translate(' + (125 * (1 - k)) + 'px,' + y + 'px) scale(' + k + ')';
        el.style.opacity = Math.min(1, k * 2.2);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
